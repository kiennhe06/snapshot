name: CI

# Runs static analysis and the test suite on every push and PR to main so
# broken code never reaches the default branch. Pinned to the Flutter version
# used locally (see `flutter --version`).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The real lib/firebase_options.dart is git-ignored (holds project keys);
      # provide a placeholder so analysis/tests can compile. Tests never call
      # Firebase.initializeApp, so the dummy values are never used.
      - name: Provide placeholder Firebase config
        run: |
          if [ ! -f lib/firebase_options.dart ]; then
            cp ci/firebase_options.stub.dart lib/firebase_options.dart
          fi

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test
